            type: string
            minLength: 1
        gate_receipts:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
        approved_by:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
        rollback_target:
          type: string
          minLength: 1
        runtime_receipts:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
        domain_receipts:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
