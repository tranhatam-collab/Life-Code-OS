      - ci_run_id
      - worker_version_id
      - pages_deployment_id
      - schema_version
      - method_release_ids
      - gate_receipts
      - approved_by
      - rollback_target
      - runtime_receipts
      - domain_receipts
      - created_at
      - verified_at
      - status
