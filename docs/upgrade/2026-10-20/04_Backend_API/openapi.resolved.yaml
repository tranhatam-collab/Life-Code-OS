              type:
              - number
              - 'null'
              minimum: 0
              maximum: 1
            scale_min:
              const: 0
            scale_max:
              const: 1
    ProfileVersion:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://schemas.lifecode.iai.one/proposed/ProfileVersion.json
      title: ProfileVersion
      type: object
      additionalProperties: false
      properties:
        profile_version_id:
          type: string
          format: uuid
        subject_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        schema_version:
          const: 2.0-proposed
        version_number:
          type: integer
          minimum: 1
        full_name_original:
          type: string
          minLength: 1
          maxLength: 200
        full_name_nfc:
          type: string
          minLength: 1
          maxLength: 200
        birth:
          $schema: https://json-schema.org/draft/2020-12/schema
          $id: https://schemas.lifecode.iai.one/proposed/Birth.json
          title: Birth
          type: object
          additionalProperties: false
          properties:
            calendar:
              enum:
              - gregorian
              - julian
              - lunisolar
              - unknown
            date_original:
              type:
              - string
              - 'null'
            date_iso:
              type:
              - string
              - 'null'
              format: date
            date_precision:
              enum:
              - full_date
              - month
              - year
              - unknown
            time_local:
              type:
              - string
              - 'null'
              pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
            time_precision:
              enum:
              - exact_reported
              - approximate
              - range
              - unknown
            time_range_local:
              type:
              - object
              - 'null'
              additionalProperties: false
              properties:
                start:
                  type: string
                  pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                end:
                  type: string
                  pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
              required:
              - start
              - end
            place_original:
              type:
              - string
              - 'null'
            timezone_id:
              type:
              - string
              - 'null'
              minLength: 1
            tzdb_version:
              type:
              - string
              - 'null'
              pattern: ^[0-9]{4}[a-z]$
            timezone_status:
              enum:
              - verified
              - hypothesis
              - unknown
            timezone_fold:
              type:
              - integer
              - 'null'
              minimum: 0
              maximum: 1
            source_kind:
              enum:
              - self_report
              - document_confirmed
              - hypothesis
            hypothesis_ids:
              type: array
              uniqueItems: true
              items:
                type: string
                format: uuid
          required:
          - calendar
          - date_original
          - date_iso
          - date_precision
          - time_local
          - time_precision
          - time_range_local
          - place_original
          - timezone_id
          - tzdb_version
          - timezone_status
          - timezone_fold
          - source_kind
          - hypothesis_ids
          allOf:
          - if:
              properties:
                date_precision:
                  const: full_date
              required:
              - date_precision
            then:
              properties:
                date_iso:
                  type: string
                  format: date
          - if:
              properties:
                time_precision:
                  const: exact_reported
              required:
              - time_precision
            then:
              properties:
                date_precision:
                  const: full_date
                date_iso:
                  type: string
                  format: date
                time_local:
                  type: string
                  pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                timezone_id:
                  type: string
                  minLength: 1
                tzdb_version:
                  type: string
                  pattern: ^[0-9]{4}[a-z]$
                timezone_status:
                  const: verified
          - if:
              properties:
                time_precision:
                  const: range
              required:
              - time_precision
            then:
              properties:
                time_range_local:
                  type: object
            else:
              properties:
                time_range_local:
                  type: 'null'
        created_at:
          type: string
          format: date-time
        supersedes:
          type:
          - string
          - 'null'
          format: uuid
        record_origin:
          enum:
          - user_entry
          - authorized_import
          - legacy_quarantine
      required:
      - profile_version_id
      - subject_id
      - tenant_id
      - schema_version
      - version_number
      - full_name_original
      - full_name_nfc
      - birth
      - created_at
      - supersedes
      - record_origin
