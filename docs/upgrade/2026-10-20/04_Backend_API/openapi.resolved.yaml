      - product_release_id
      - method_release_ids
      - claim_ids
      - locale
      - content_version
      - sections
      - review_state
      - reviewer_id
      - snapshot_digest
      - source_digest
      - rendered_from_snapshot_only
      - authorization_snapshot_id
      - published_at
      - created_at
      allOf:
      - if:
          properties:
            review_state:
              enum:
              - approved
              - published
        then:
          properties:
            reviewer_id:
              type: string
              format: uuid
      - if:
          properties:
            review_state:
              const: published
          required:
          - review_state
        then:
          properties:
            subject_ids:
              type: array
              minItems: 1
            profile_version_ids:
              type: array
              minItems: 1
            method_release_ids:
              type: array
              minItems: 1
            claim_ids:
              type: array
              minItems: 1
            sections:
              type: array
              minItems: 1
            reviewer_id:
              type: string
              format: uuid
            authorization_snapshot_id:
              type: string
              format: uuid
            published_at:
              type: string
              format: date-time
    Tail80Result:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://schemas.lifecode.iai.one/proposed/Tail80Result.json
      title: Tail80Result
      type: object
      additionalProperties: false
      properties:
        method_id:
          const: lc_tail4_mod80
        formula_id:
          const: FC-TAIL80-001
        formula_version:
          const: 1.0-proposed
        suffix:
          type: string
          pattern: ^[0-9]{4}$
        quotient:
          type: integer
          minimum: 0
          maximum: 124
        remainder:
          type: integer
          minimum: 0
          maximum: 79
        lookup_code:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 80
        zero_policy:
          enum:
          - unmapped
          - as80
        table_version:
          type: string
          minLength: 1
        source_ref:
          type:
          - string
          - 'null'
          minLength: 1
        rights_state:
          enum:
          - unknown
          - pending
          - permitted
          - restricted
          - expired
        source_label:
          type:
          - string
          - 'null'
        is_personalized:
          const: false
        probability:
          type: 'null'
      required:
      - method_id
      - formula_id
      - formula_version
      - suffix
      - quotient
      - remainder
      - lookup_code
      - zero_policy
      - table_version
      - source_ref
      - rights_state
      - source_label
      - is_personalized
      - probability
      allOf:
      - if:
          properties:
            remainder:
              const: 0
            zero_policy:
              const: unmapped
          required:
          - remainder
          - zero_policy
        then:
          properties:
            lookup_code:
              type: 'null'
            source_label:
              type: 'null'
      - if:
          properties:
            remainder:
              const: 0
            zero_policy:
              const: as80
          required:
          - remainder
          - zero_policy
        then:
          properties:
            lookup_code:
              const: 80
      - if:
          properties:
            remainder:
              minimum: 1
              maximum: 79
          required:
          - remainder
        then:
          properties:
            lookup_code:
              type: integer
              minimum: 1
              maximum: 79
            source_label:
              type: string
              minLength: 1
      $comment: Backend must additionally enforce int(suffix)=80*quotient+remainder and lookup_code=remainder when remainder
        is nonzero; JSON Schema cannot express modulo arithmetic.
    ProblemDetails:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - code
      - request_id
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
          minLength: 1
          maxLength: 200
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type:
          - string
          - 'null'
          maxLength: 2000
        instance:
          type:
          - string
          - 'null'
          format: uri-reference
        code:
          type: string
          pattern: ^[a-z][a-z0-9_]{2,63}$
        request_id:
          type: string
          minLength: 8
          maxLength: 128
        errors:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required:
            - field
            - code
            properties:
              field:
                type: string
                maxLength: 500
              code:
                type: string
                pattern: ^[a-z][a-z0-9_]{2,63}$
